# THE MIGRATION LEDGER
#
# Every component of the current system gets exactly one row here, and every
# row ends in a disposition. Nothing leaves the old system without a row, and
# no row may sit in `pending` forever without being visible.
#
# This file is the enforcement mechanism for the first of the two conditions
# attached to the rebuild: anything not carried over must be documented well
# enough to revisit. `dropped` is a legitimate outcome -- silence is not.
#
# CI checks, in tests/core/test_migration_ledger.py:
#   1. every row has a disposition from the closed set below
#   2. every `dropped` or `deferred` row names an ADR that EXISTS on disk
#   3. no row claims `old_removed: true` while its disposition is pending
#   4. every data_artifact named here has a data_disposition
#
# DISPOSITIONS (closed set -- adding one means editing the test too):
#   pending   - not yet decided. The only state with no ADR requirement.
#   ported    - moved into the new core substantially as-is
#   rewritten - reimplemented against the new interfaces; behaviour may differ
#   dropped   - deliberately not carried over. REQUIRES an ADR with a Recovery
#               section giving the git tag or path where it can be found.
#   deferred  - will be revisited, not now. REQUIRES an ADR and a trigger.
#
# DATA DISPOSITIONS, for the second condition -- the data must survive:
#   raw       - immutable source data. Never regenerated, never deleted.
#   training  - derived but NOT reproducible (hand-corrections, manual entity
#               matches, judgement encoded as data). Treat as raw. This is the
#               category that quietly gets destroyed in rebuilds.
#   derived   - reproducible from raw by code. Archive old, regenerate new,
#               compare.
#   cache     - reproducible and cheap. Safe to delete.

version: 1
updated: "2026-09-21"

# ---------------------------------------------------------------------------
# Seeded with the components the new core already replaces, plus the two known
# Condition-2 hazards found during the audits. The rest of the inventory is
# added as each component is examined -- an empty row list would let the CI
# coverage check pass vacuously, which is why test_ledger_is_not_vacuous exists.
# ---------------------------------------------------------------------------
components:

  - id: runtime-version-pin
    old_path: "(nothing pinned -- CI 3.11, Render a creation-date default, laptop 3.9)"
    new_path: ".python-version + .github/workflows/checks.yml"
    disposition: rewritten
    adr: null
    data_artifacts: []
    data_disposition: null
    parity_status: not_applicable
    parity_tolerance: null
    old_removed: false
    notes: >-
      Found 2026-09-21 while setting up a local environment: three runtimes,
      none declared. CI pinned 3.11 via setup-python; the laptop had system
      3.9 with no packages at all; and Render documents that an unpinned
      service gets a default chosen by its CREATION DATE, anywhere from 3.7.10
      to 3.14.3. So the interpreter running the live cron jobs was decided by
      when the service happened to be created, and nothing recorded it.
      Pinned with .python-version (3.11.16), which Render reads and which a
      guard test now asserts agrees with the CI pin.
      NOT pinned via render.yaml: a `pythonVersion:` key was added there first
      and then reverted -- Render's docs support PYTHON_VERSION as an env var
      or a .python-version file, and document no such blueprint key. Putting an
      unrecognised key into a live Blueprint would have been worse than the
      gap it was meant to close.
      Takes effect on the services at their next build.

  - id: execution-slate-runner
    old_path: "(did not exist -- no single command ran a slate)"
    new_path: "scripts/recommend_slate.py + src/coverline/leagues/nfl/events.py"
    disposition: rewritten
    adr: null
    data_artifacts: []
    data_disposition: null
    parity_status: not_applicable
    parity_tolerance: "no predecessor"
    old_removed: false
    notes: >-
      The operator-facing command: model -> market -> stake -> ledger, in one
      run. Dry by default, because the ledger is append-only and a
      misconfigured slate cannot be taken back out of it.
      It defaults to the ROBUST shrinkage weight (0.5202) rather than the
      pooled one (0.8862), and --pooled prints a warning naming the gap.
      Sizing real money from a weight resting on a single experiment is the
      mistake the shrinkage machinery exists to avoid.
      BUILDING IT EXPOSED THE LAST STRUCTURAL GAP: bronze event ids are the
      book's, and the model keys on 2026-W02-LA-NYG, so the runner had a model
      and a market and no way to know they described the same game. events.py
      is that join. Unknown names RAISE -- a relocation or rebrand should stop
      the run, not quietly match a team to its predecessor -- and unmatched
      events are NAMED, not counted, because a slate silently pricing 6 of 16
      games is the shape of a problem that goes unnoticed for weeks.
      The name table duplicates deploy/odds_watch_job.ODDS_TEAM_TO_ABBR. A
      second table joined on the same key is the ADR 0004 failure exactly, so
      a guard test asserts the two are equal; that test is the only thing that
      makes the duplication acceptable.

  - id: execution-recommend
    old_path: "(did not exist -- nothing joined model, market and stake)"
    new_path: "src/coverline/execution/recommend.py"
    disposition: rewritten
    adr: null
    data_artifacts: []
    data_disposition: null
    parity_status: not_applicable
    parity_tolerance: "no predecessor"
    old_removed: false
    notes: >-
      The integration layer. Every other module produces one input to it -- a
      league produces a ScoreDistribution, ingest produces quotes, the
      evidence log produces a shrinkage weight, staking produces a size -- and
      none of it does anything until something joins them.
      FOUR RULES, each from something already learned here. Pushes are
      CONDITIONED OUT, not ignored: a spread has three outcomes, and the
      quantity comparable to a devigged two-way price is P(cover | not push).
      An integer line is WITHHELD when the distribution has no measured
      key-number correction, because a plain rounded normal understates
      P(margin=3) roughly threefold and the resulting edge would be wrong in
      the flattering direction. Every candidate becomes a ledger row,
      including the declined ones. And it recommends without betting: no
      network, no book API, no side effect beyond the ledger.
      A withheld candidate produces NO signal at all -- withholding is not a
      recommendation, including a negative one.

  - id: execution-grade
    old_path: "(did not exist -- captured closes and recorded bets never met)"
    new_path: "src/coverline/execution/grade.py"
    disposition: rewritten
    adr: null
    data_artifacts:
      - "data/ledger/closes.jsonl"
    data_disposition: raw
    parity_status: not_applicable
    parity_tolerance: "no predecessor"
    old_removed: false
    notes: >-
      CLOSES THE LOOP. The ledger held what was recommended and bet; bronze
      held what the market closed at; nothing joined them, so CLV was
      computable in principle and computed never.
      THE CLOSE IS THE LAST SNAPSHOT STRICTLY BEFORE KICKOFF, never the latest
      available. A post-kickoff snapshot carries an in-play price, and using
      it would move every CLV figure in whichever direction the game went --
      a bias that would look like skill.
      It will not invent a close: a signal whose event never appeared in a
      captured snapshot stays ungraded and is REPORTED ungraded, because an
      ungraded bet and a break-even one are different facts. It will not
      re-grade either -- two closes for one signal is two versions of what the
      market did.
      Prop closes are marked invalid and COUNTED SEPARATELY, not averaged in.
      The summary also reports how much a naive CLV figure would overstate,
      which is the size of the mistake carried by any CLV number whose author
      did not say which close it was computed against.

  - id: execution-bet-ledger
    old_path: "(did not exist -- no record of what was bet or why not)"
    new_path: "src/coverline/execution/ledger.py"
    disposition: rewritten
    adr: null
    data_artifacts:
      - "data/ledger/signals.jsonl"
      - "data/ledger/closes.jsonl"
      - "data/ledger/settlements.jsonl"
    data_disposition: raw
    parity_status: not_applicable
    parity_tolerance: "no predecessor"
    old_removed: false
    notes: >-
      THE DESIGN DECISION IS RECORDING SIGNALS THAT DID NOT BECOME BETS. A
      ledger of placed bets measures how the bets you got performed; it cannot
      measure what execution cost, because the ones you missed -- line moved,
      book limited you, nobody was awake -- leave no trace. The gap between
      recommendations and positions held IS the execution layer's performance,
      and the strategy audit put that layer above model quality.
      Append-only. A bet's later life (close, settlement) arrives as separate
      rows keyed to it, never as an edit: rewriting a betting ledger is how a
      losing week becomes a break-even one without anyone deciding to lie.
      Refuses what it cannot later grade -- a placed bet without book, price
      and stake; a free-text reason for a signal that did not convert (free
      text is how the commonest reason becomes unqueryable); a close given as
      one side of a market.
      Unsurveyed bets count as UNMEASURED, not as zero slippage, so execution
      quality is not flattered exactly where nothing was checked.
      Stores no account identifiers or credentials; a test inspects the
      dataclass fields rather than grepping prose.

  - id: execution-capture
    old_path: "(did not exist -- no closing prices were ever captured)"
    new_path: "src/coverline/execution/capture.py"
    disposition: rewritten
    adr: 0002-odds-data-vendor-and-tier.md
    data_artifacts:
      - "data/bronze/odds/**/current-*.json"
    data_disposition: raw
    parity_status: not_applicable
    parity_tolerance: "no predecessor"
    old_removed: false
    notes: >-
      Built ahead of Thursday's subscription. Clusters a slate's kickoff times
      into the fewest polls that cover it -- one request returns every game
      live at that instant -- which is what makes five leagues affordable:
      peak capture is 1,131 credits/month, recomputed in tests rather than
      quoted from the ADR.
      THE REFUSAL BEHAVIOUR IS THE POINT. A window whose moment has passed is
      OVERDUE, not retryable: capturing it would file an in-play price under a
      pre-game timestamp, a quieter corruption than missing it. Overdue
      windows are gapped and never fetched, and a test asserts no request was
      issued. A future window is neither captured nor gapped, because gapping
      it would manufacture a hole.
      Re-running is free: an already-captured window is skipped without a
      request, so the job can sit on a tight cron without paying twice.

  - id: execution-backfill
    old_path: "(did not exist -- no historical odds were ever fetched)"
    new_path: "src/coverline/execution/backfill.py + scripts/backfill.py"
    disposition: rewritten
    adr: 0002-odds-data-vendor-and-tier.md
    data_artifacts:
      - "data/bronze/odds/**/historical-*.json"
    data_disposition: raw
    parity_status: not_applicable
    parity_tolerance: "no predecessor"
    old_removed: false
    notes: >-
      Built ahead of the subscription (expected Thursday 2026-09-24) so the
      key can be put to work the day it arrives rather than starting a build.
      Three protective properties, each tested by making it matter: cost is
      computed with no network before anything is spent; the job is resumable
      from bronze so a crash costs only the unfetched part; and a budget
      refusal stops the run and GAPS the remainder rather than leaving holes
      indistinguishable from timestamps the API had no data for.
      Measured: the realistic five-league one-season plan is 2,992 snapshots
      and 89,760 credits -- 90% of a month on the 100K tier, which crowds out
      live capture. The CLI says so and suggests splitting across months.
      Fetched snapshots are RAW: a close that was not captured is gone at any
      price, and the backfill is the only way to obtain the past ones.

  - id: core-distributions
