  - id: league-mlb
    old_path: "model/mlb_model.py (walk-forward expected runs)"
    new_path: "src/coverline/leagues/mlb/{model,sources}.py"
    disposition: ported
    adr: null
    data_artifacts:
      - "model/mlb_dispersion_results.json"
    data_disposition: derived
    parity_status: not_applicable
    parity_tolerance: >-
      Thin adapter over exp_home/exp_away; no independent margin model to
      compare against.
    old_removed: false
    notes: >-
      THE DISTRIBUTION FAMILY WAS CHOSEN BY MEASUREMENT AND THE OBVIOUS
      CHOICE WAS WRONG. Baseball is the sport people reach for Poisson with;
      over 12,148 walk-forward games runs are 2.2x overdispersed
      (variance/mean 2.15 home, 2.37 away). A Poisson would understate run
      variance by more than half.
      The shared-component Poisson was the natural fix and is also wrong: it
      buys total variance by creating positive correlation, and the measured
      correlation is +0.0006. Independence is CONFIRMED rather than assumed --
      measured margin variance (20.11) and total variance (20.13) both equal
      the sum of the side variances (20.12), which a shared component would
      break.
      So: independent negative binomials, a third distribution family added to
      core without touching pricing or staking. That is the seam earning its
      keep.
      LIVE SOURCE ADDED 2026-09-21 over the in-season caches the cron keeps
      current. It reports its own staleness rather than hiding it -- a source
      quietly serving three-day-old expected runs for tonight's game would be
      confidently wrong, which is worse than being unavailable -- and refuses
      a game the walk-forward produced no expectation for instead of
      approximating one.
      BUILDING IT FOUND A BUG IN THE RECOMMENDER. MLB has an ~11% tie mass in
      the modelled margin and baseball has no ties, so a game with a +0.42
      expected margin reported P(home) = 0.49. The moneyline path was not
      conditioning out its voiding outcome the way the spread path conditions
      out a push -- a 5.9 point error, enough to flip the side on a near-even
      market. A moneyline is a spread of zero and now routes through the same
      function.

  - id: league-nhl-nba-structure
    old_path: "(no legacy -- new leagues)"
    new_path: "src/coverline/leagues/{nhl,nba}/model.py"
    disposition: rewritten
    adr: 0010-refresh-the-nhl-pull-table-and-check-shape.md
    data_artifacts: []
    data_disposition: null
    parity_status: not_applicable
    parity_tolerance: "nothing fitted to compare"
    old_removed: false
    notes: >-
      RESOLVED 2026-09-21. This row kept saying STRUCTURE ONLY after the
      records that superseded it had shipped, which is the exact failure a
      reverse index exists to prevent -- so it is corrected here rather than
      left to be believed.

      Both leagues now ship fitted, held-out-graded parameters that travel
      with their own grade and a loader that refuses one which did not clear:
      NBA ratings at t = +5.96 graded once on 2023 (ADR 0006), NHL rates at
      t = +2.44 after a lookahead fix, and an NHL rules layer refreshed and
      re-graded at t = +34.95 whose goalie-pull component clears separately at
      +5.82 (ADRs 0008 and 0010). STRUCTURAL_ONLY_LEAGUES is empty.

      The original reasoning is kept below, because it was right and it is why
      the packages were shaped this way.

      STRUCTURE ONLY, NO FITTED COEFFICIENTS. No legacy to port, no committed
      cache, no held-out grading. Shipping constants fitted in an afternoon
      would be indistinguishable six months later from measured ones, which is
      the failure the whole evidence apparatus exists to prevent. A test fails
      if either file grows a module-level numeric constant.
      The packages exist so the seam is proven for all five leagues, and so
      the known traps are written where whoever fits them will look.
      NHL: empty-net goals are ~7% of scoring and arrive conditional on a late
      one-goal deficit in a league where ~57% of games are one-goal games, so
      they inflate the winner's score in exactly the games that decide the
      puck line -- which is why the puck line is NOT offered. And the fixed
      1.5 line means the SHAPE of the goal distribution does work the mean
      cannot, so a win-probability model is insufficient here.
      NBA: margin variance correlates ~0.60 with spread magnitude against
      ~-0.06 in the NFL, so a constant sigma is the specific mistake a ported
      football model makes. NBAModel therefore takes a sigma FUNCTION with no
      default. The real model in this sport is player impact weighted by
      projected minutes, not a team rating, and GameFeatures records whether a
      minutes projection was applied so a team-level approximation is not
      mistaken for one.

  - id: league-nfl-pricing-leaf
    old_path: "model/prediction.py (predict_margin, coefficient vectors)"
    new_path: "src/coverline/leagues/nfl/model.py"
    disposition: ported
    adr: null
    data_artifacts:
      - "data/nfl_key_numbers.json"
    data_disposition: derived
    parity_status: verified_rating_only
    parity_tolerance: >-
      MEASURED 2026-09-21: new core vs model/prediction.predict_margin over all
      1,945 games in the committed walk-forward cache (2014-2023), max absolute
      divergence < 1e-9 points. The harness is itself checked -- a 1% change to
      one coefficient must move the margin, or the comparison is not exercising
      what it claims. Covers the RATING-ONLY vector only; full-ensemble parity
      needs the NGS feature cache ported.
    old_removed: false
    notes: >-
      Carries the documented home_field/intercept collinearity defect forward
      unchanged: net home edge for equal teams is -1.13 against a market near
      +2.5. CORRECTED 2026-09-25: that is the FULL-ENSEMBLE vector, which no
      live price uses (the live source is rating-only, equal-team edge +1.65).
      The live vector's neutral-site handling was measured instead
      (data/nfl_neutral_site.json): 1.60 points further below the close at
      neutral sites than at home (SE 0.62, n 34), recorded, not corrected. Exposed as home_edge_for_equal_teams() and pinned by a test that
      fails if someone corrects it in place. The vector was validated as a
      vector; changing one term invalidates the validation. Fix belongs at the
      next refit.
      Totals absent from primary_markets on purpose (totals_validation.json
      supported=false).

  - id: board-feature-provenance
    old_path: "deploy/odds_watch_job.py + model/prediction.py (recorded which features, not their values)"
    new_path: "same files -- feature_values added, additive only"
    disposition: rewritten
    adr: null
    data_artifacts:
      - "data/divergence/*.json (feature_values field, from 2026-09-21)"
    data_disposition: raw
    parity_status: verified_forward_only
    parity_tolerance: >-
      Recorded values run through the recorded coefficient vector must
      reproduce the published margin to 1e-6. Enforced by
      tests/core/test_board_provenance.py, which SKIPS boards written before
      the change rather than passing on them -- an old artifact cannot acquire
      provenance retroactively.
    old_removed: false
    notes: >-
      FOUND BY TRYING TO VERIFY FULL-ENSEMBLE PARITY AND FAILING. Reconstructing
      the 2026 week 2 full-ensemble games from committed artifacts missed by
      -2.3 to +3.8 points, and the Elo difference implied to close the gap
      flipped sign on one game -- so the error could not be attributed to any
      single input. NGS releases and Elo state both move between runs, so a
      published number could not be re-derived and a model change could not be
      told apart from a data change.
      For a project whose pillar is that every claim is graded publicly, a
      claim whose inputs are unrecorded is not really gradeable. The board now
      records the feature VALUES alongside the booleans it already kept.
      Strictly additive: nothing here changes a published number, and a test
      asserts feature_values is only ever written after a prediction, never
      read into one.
      CONSEQUENCE: full-ensemble live parity is verifiable from the next cron
      run onward, and is NOT verifiable for any board published before today.

  - id: ngs-team-code-mismatch
    old_path: "model/prediction.py build_week_predictions + model/layer2_ngs.py"
    new_path: "src/coverline/leagues/nfl/ngs.py (new core normalises; legacy untouched)"
    disposition: rewritten
    adr: 0004-ngs-team-code-mismatch.md
    data_artifacts: []
    data_disposition: null
    parity_status: not_applicable
    parity_tolerance: null
    old_removed: false
    notes: >-
      A LIVE BUG FOUND 2026-09-21 while porting the NGS fetch. The ratings
      snapshot and the nflverse schedule call the Rams "LA"; the nflverse NGS
      release calls them "LAR". build_week_predictions decides
      ngs_present = home in ngs_features.index and away in ngs_features.index,
      so EVERY Rams game falls back to MARGIN_COEFFICIENTS_V1_RATING_ONLY --
      and that vector carries no elo_diff term, so those games lose Elo too.
      Measured scope: 17 games a season in every one of 2022-2026, 85 games
      across the committed range. It presents as "NGS unavailable for this
      game", which is indistinguishable from the feed being down.
      MEASURED 2026-09-21 and the fix is NOT an improvement: graded on the 26
      Rams games in 2022-2023, paired gain +0.0911 MAE, SE 0.7570, t = +0.12.
      A first version held elo at 0.0 on both sides and returned t = -1.68 --
      comparing the rating-only vector against a full ensemble missing one of
      its own features. The unfair version was the more dramatic one.
      So: correctness question, not edge question. The new core normalises
      because 31-teams-one-way is an unprincipled split that will confuse
      every future per-team analysis. The LEGACY is deliberately untouched --
      changing a live board on t = +0.12 needs a reason, and "no detectable
      difference" is not one.
      Guarded by tests/core/test_team_codes.py, which compares source
      vocabularies directly so the next join mismatch fails loudly.

  - id: league-nfl-feature-source
    old_path: "model/ratings.py, model/elo_rating.py, model/layer2_ngs.py"
    new_path: "src/coverline/leagues/nfl/sources.py (cache adapter, not a rewrite)"
    disposition: ported
    adr: null
    data_artifacts: []
    data_disposition: null
    parity_status: not_started
    parity_tolerance: >-
      When ported: rating_diff and the NGS differences must reproduce the
      legacy walk-forward cache within floating-point tolerance on a common
      slate, with point-in-time correctness enforced by the asof contract.
    old_removed: false
    data_artifacts:
      - "model/expanded_walk_forward_cache.csv"
    data_disposition: training
    notes: >-
      BRANCH BY ABSTRACTION, NOT REWRITE. The rating pipeline itself is still
      upstream in model/ and is deliberately NOT reimplemented: it is
      numerically delicate, and rewriting it first would leave any divergence
      from the board indistinguishable from a bug. Instead the new interface
      is served from the committed walk-forward cache the legacy pipeline
      produced, which makes parity measurable -- and it now measures at
      < 1e-9 over 1,945 games.
      LIMITS, STATED: the cache carries rating_diff, home_field and rest_diff
      only. No NGS differences, no elo. So features report ngs_present=False,
      which is the truth and selects the rating-only vector. Claiming NGS with
      zero-valued differences would select the full ensemble and misprice every
      game -- the failure that ran for weeks before the audit.
      LIVE SOURCE ADDED 2026-09-21 (leagues/nfl/live.py): reads the published
      weekly ratings snapshot joined to the nflverse schedule, which carries
      home_rest/away_rest and neutral-site status directly. Verified by
      reconstructing the PUBLISHED board margin for the rating-only games on
      the 2026 week 2 slate to 1e-6 -- same ratings, same schedule, same
      coefficients, same number the site shows.
      Selection is by WEEK, never by mtime: the newest snapshot is always the
      convenient one and is lookahead, since it has seen results the week in
      question had not. A snapshot computed after a game raises.
      STILL NOT ENOUGH FOR BUILT_LEAGUES. The board runs the full ensemble
      wherever NGS is present -- 6 of 16 games that week -- and NGS is a
      runtime fetch, not a committed artifact. Registering nfl now would make
      the new core price those 6 games with the rating-only vector and
      disagree with the board without saying so. The NGS fetch port is the
      remaining blocker.

      OFF BY ONE WEEK, FIXED 2026-09-23 (with the owner's approval; the
      dashboard brief otherwise froze model code). deploy/weekly_job.py names a
      snapshot for the last week with a completed game and publishes it for
      the next; for_week() read the number as the week being priced, so an
      upcoming week could never be priced -- the file it wanted appears only
      after the week, when the lookahead guard refuses it. The operator
      command, paper trading and the board all failed on it silently until the
      board export surfaced "no ratings snapshot for 2026 week 3".
      GameWeekSource now prices each game from the newest immutable version
      computed on or before its day (history/ plus canonical), never a later
      one; for_week() and its parity tests are unchanged.
