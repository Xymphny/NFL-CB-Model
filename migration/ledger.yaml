    old_removed: false
    notes: >-
      A CONDITION-2 LOSS THAT HAS ALREADY HAPPENED. Shipped constants in
      model/player_projection.py cite a grid search whose output exists in no
      committed file and whose specification is also gone.

      PARTIALLY ADDRESSED 2026-09-21, and the row STAYS OPEN because the
      original artifact is still lost and what exists now is a
      reconstruction, not a recovery. model/calibrate_player_td_lambda.py
      sweeps every one of those constants on training seasons alone and
      commits the surface. The finding is that the constants hold up: seven
      of ten sit exactly on the training argmin, and the three that do not --
      ENV_DAMP, LONG_CRED, ENV_CLAMP -- have the three SMALLEST spreads in
      the whole sweep, down to 0.000022 of log-loss for ENV_CLAMP. Whoever
      ran the lost grid picked defensible values.

      Nothing was re-selected. The three off-argmin values stay put, because
      adopting a train argmin is a new selection that the next holdout pays
      for, and because a spread of 0.00002 is not a reason to move anything.

      It remains the worked example of why the data condition is first-class:
      it took a day of work to find out that constants nobody could check
      were fine, and that day would have been unnecessary if the grid had
      been committed when it was run.

  - id: operator-five-league
    old_path: "scripts/recommend_slate.py (NFL and CFB only); deploy/mlb_odds_watch.py (observation-only MLB board, no model price)"
    new_path: "scripts/recommend_slate.py + src/coverline/leagues/{mlb,nhl,nba}/live.py + src/coverline/execution/matching.py"
    disposition: rewritten
    adr: null
    data_artifacts:
      - "data/raw/nhl/schedule_*.parquet"
      - "data/raw/sportsdataverse/nba_2026.parquet onward"
      - "data/raw/mlb/slates/*.json"
    data_disposition: raw
    parity_status: verified
    parity_tolerance: >-
      Exact, not approximate. Each live source replays the fit script's own
      walk-forward, imported rather than restated. NBA: a replay of 2021-2023
      reproduces all 30 ratings in data/nba_fitted.json, and every 2023 game
      priced as of its tip reproduces the graded margin (all 1,229
      non-neutral games checked once at build; about 60 in CI). NHL:
      the no-pull rates for any game equal fit_nhl_rules.rate's row for it.
      MLB: the state before any game reproduces run_walk_forward's
      exp_home/exp_away for it. Differences measured: 0.
    old_removed: false
    notes: >-
      THE OPERATOR COMMAND COVERS ALL FIVE LEAGUES. Football slates are weeks,
      the rest are US-Eastern dates; the wrong one is refused, not ignored.
      Each league's inputs refuse with the command that fixes them.

      MLB, NHL AND NBA PAPER-TRADE BY DEFAULT. The staking weight blends the
      model toward the market, and the only weight the repository computes
      (evidence/attempts.yaml) is graded model against model. None of these
      three leagues has any market-facing grade, so the default weight is 0:
      both prices are computed and recorded, nothing is staked, and --commit
      writes the rows a market-relative grade will need. --market-weight
      overrides it and says it is a guess. Football keeps its weight and now
      prints what that weight does not measure.

      THREE DEFECTS FOUND BUILDING IT. (1) The runner looked snapshots up as
      "nfl" while capture.py stores them as "americanfootball_nfl", so a
      captured snapshot would never have been found. (2) It never passed the
      league's primary_markets to recommend(), so the market control was
      off; it is on for every league now. (3) sources.WalkForwardSource, the
      earlier MLB live source, replays the CURRENT season alone and cannot
      price an unplayed game at all -- every fit and grade ran the historical
      cache continuously, so it was a cold-start model different from the
      one measured. mlb/live.py replays across seasons as graded.

      TWO INGEST FIXES ALONG THE WAY. nhl_api.py kept any game with a score,
      and the schedule endpoint returns a score for a game IN PROGRESS; it now
      keeps only final states. fit_nba.load would have replayed a half-time
      score from a mid-season pull as a result; it now requires completion.
      Neither changes a committed season (test_fitted_artifacts_reproduce).

      INGESTS RUN LIVE 2026-09-22. NBA: `nba_espn.py --verify 2025` found 0
      disagreements across all 1,230 regular-season games against the
      committed sportsdataverse file; 2025-26 (4 postponed, rest final) and
      the 2026-27 schedule pulled, and every 2026-27 team code resolves
      except the NBA Cup's TBD placeholders, which are refused by name. NHL:
      2025-26 finals and goals pass check_scores and the overtime-margin
      rule; the 2026-27 schedule is 1,344 games, the 84-game season. MLB: the
      slate's pitcher keys land on the same keys as each starter's completed
      starts, including mlbam-keyed pitchers with no Retrosheet id.

      THE MLB FRESHNESS CHECK WAS TOO WEAK AND WAS REPLACED. It compared the
      cache's last DATE to the previous final date; run mid-evening with 5 of
      15 results in, it passed. The slate now records the exact game keys
      played to a result and any still in progress, and the live source
      refuses unless every one is in the cache.

      STILL UNVERIFIED: the NHL and NBA team-name tables against the Odds
      API's own spellings. That needs an odds payload, so it is Thursday's.

      SCHEDULED 2026-09-22 as live-inputs-job (deploy/live_inputs_job.py,
      render.yaml): NBA and NHL current-season pulls, NHL goal rows, the MLB
      slate and the integrity audit, at 10:40 and 15:40 UTC. Free endpoints
      only; the job has no Odds API key and cannot spend credits. Each league
      fails alone, what succeeded is committed, and a failure exits non-zero
      and posts to ALERT_WEBHOOK_URL. Run end to end against the live
      endpoints before it was scheduled; an unchanged day commits nothing.

