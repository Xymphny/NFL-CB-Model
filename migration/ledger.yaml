  - id: frozen-threshold-grid
    old_path: "model/ (eight constants citing a grid search)"
    new_path: "model/calibrate_player_td_lambda.py + model/player_td_grid.json"
    disposition: pending
    adr: 0013-the-missing-grid-reconstructed.md
    data_artifacts:
