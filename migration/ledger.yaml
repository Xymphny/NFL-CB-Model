    data_disposition: raw
    parity_status: not_applicable
    parity_tolerance: "no predecessor to compare against"
    old_removed: false
    notes: >-
      Client BUILT and fully tested offline 2026-09-21 (27 tests, injected
      transport, no key required) -- deliberately, since ADR 0002 says not to
      subscribe until there is something to consume the data.
      Vendor and tier decided (ADR 0002): The Odds API, $59/100K. Pinnacle
