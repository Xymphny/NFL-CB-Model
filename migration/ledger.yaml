    old_removed: false
    notes: >-
      Structurally unlike NFL despite sharing a distribution family. NO
      home_field term -- home advantage sits in the intercept, so a
      neutral-site game is not expressible by dropping a term. The vector
      split is by ELO availability, not NGS, and the fallback is a separate
      fit (rating coefficient 39.19 against the ensemble's 15.69) because it
      carries alone.
      MARGIN_SD was MEASURED, not borrowed: 17.54 against NFL's 13.30. It was
      first written as a guessed 18.65 and the measurement disagreed. The same
      measurement found a +2.16 point mean residual on the DVOA-only path --
      a systematic lean, recorded and NOT corrected, since subtracting a
      constant from a fitted vector is a model change.

  - id: league-cfb-live
    old_path: "src/coverline/leagues/cfb/sources.py CachedWalkForwardSource (2021-2023 cache only; no current game)"
    new_path: "src/coverline/leagues/cfb/{live,teams}.py"
