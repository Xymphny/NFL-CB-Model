      AUTOMATED 2026-09-22. close-capture-job --paper prices each captured
      window's games (those starting within 3h) as paper trades -- weight 0,
      never placed -- and commits them with the snapshot; live-inputs-job
      settles them daily. Regrading is deliberately NOT automated: a league
      passing the 150-game floor fails the reproduction test in CI, which asks
