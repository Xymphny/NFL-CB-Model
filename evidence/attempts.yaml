# THE ATTEMPT LOG
#
# Every candidate model change ever evaluated on held-out data, INCLUDING the
# ones that failed. This is the input to the empirical-Bayes shrinkage weight
# b = 1 - 1/E[t^2] that replaced the old ship/no-ship significance gate.
#
# WHY FAILURES ARE THE POINT
# The weight is an estimate of how much of the measured effect in a typical
# candidate is real rather than noise. Computing it from winners only inflates
# E[t^2] and returns a weight that ships noise at full size -- which is the
# selection effect the whole mechanism exists to undo. A log that quietly drops
# nulls is worse than no log, because it produces a confident wrong number.
#
# ELIGIBILITY -- one estimand, strictly
# An attempt is eligible for the weight only if it is a HELD-OUT PAIRED GAIN
# against the incumbent, expressed as estimate / standard_error. Training-side
# coefficient t-statistics are NOT eligible and are recorded separately below:
# they answer "is this variable associated with the target", not "does this
# change help on data it has never seen", and mixing the two would badly
# inflate the weight. The repo contains train-side t-statistics as large as
# +8.51 whose held-out counterparts are far smaller; that gap is the reason
# for the rule.
#
# THIS LOG IS A LOWER BOUND, AND THE WEIGHT IT PRODUCES IS AN UPPER BOUND
# It was reconstructed on 2026-09-21 from committed artifacts and the README
# ledger, because no attempt log was kept at the time -- the project recorded
# findings, not attempts. Attempts that were tried and never written up are
# therefore missing, and they skew toward failures, since nobody writes up a
# null they were not already interested in. Missing failures mean E[t^2] is
# biased UP, so b is biased UP. Treat the computed weight as a ceiling, not an
# estimate, until enough prospectively-logged attempts accumulate to replace
# the recovered ones.

version: 1
updated: "2026-09-21"

policy:
  eligible_estimand: "held-out paired gain vs incumbent, estimate / standard_error"
  graded_once: true
  recovered_are_a_lower_bound: true

# ---------------------------------------------------------------------------
# ELIGIBLE: held-out paired gains. These produce the weight.
# ---------------------------------------------------------------------------
attempts:

  - id: preseason-prior-regression
    date: "2026-09-20"
    hypothesis: >-
      Regress the preseason prior toward the mean per component instead of
      carrying raw previous-season rating forward.
    estimand: held_out_paired_gain
    metric: mae
    estimate: 0.0128
    standard_error: 0.0056
    t: 2.28
    decision: shipped
    recovered: true
    source: model/preseason_prior_regression_results.json (paired_mae_gain)
    note: >-
      The one clear winner in the recovered set. 13.9% improvement on the
      held-out seasons.

  - id: qb-continuity-conditional-prior
    date: "2026-09-20"
    hypothesis: >-
      Condition the carryover coefficient on whether the starting QB returned.
    estimand: held_out_paired_gain
    metric: mae
    estimate: -0.00042
    standard_error: 0.00245
    t: -0.17
    decision: rejected
    recovered: true
    source: model/qb_continuity_prior_results.json (paired_gain)
    note: >-
      The most informative row in this file. Train-side interaction was
      t=+2.36 on total rating and +2.63 on offense, and the placebo PASSED --
      QB continuity moved offense and not defense, exactly as a real effect
      should. It still failed its held-out gate. A log of findings would have
      recorded the placebo; only a log of attempts records the -0.17.

  - id: cfb-returning-production-rescale
    date: "2026-09-20"
    hypothesis: >-
      Rescale the CFB returning-production discount by 0.442/0.516 = 0.856 to
      match the carryover actually measured.
    estimand: held_out_paired_gain
    metric: rank_correlation
    estimate: 0.00182
    standard_error: 0.00094
    t: 1.93
    decision: not_shipped
    recovered: true
    source: model/cfb_carryover_check_results.json (returning_production_test.gate)
    note: >-
      Effect direction well supported (interaction t=+2.13, monotonic
      terciles, improves held-out rank correlation) while the specific change
      gates at 1.93. The distinction between "the effect is real" and "this
      change helps" in one row.

  - id: elo-term-for-ngs-absent-games
    date: "2026-09-20"
    hypothesis: >-
      Restore an elo_diff term on games where NGS data is absent, since the
      rating-only coefficient vector carries none.
    estimand: held_out_paired_gain
    metric: mae
    estimate: 0.0995
    standard_error: 0.0690
    t: 1.44
    decision: not_shipped
    recovered: true
    source: README ledger, spread validation section
    note: >-
      Train-side elo_diff on NGS-absent games was t=+4.14. Held out, with
      full-slate de-bias, the gain is t=1.44. The exposure is narrow in
      normal weeks and total during an NGS outage, which is the reason to
      revisit rather than close.

  - id: half-life-100-vs-default-6
    date: "2026-09-20"
    hypothesis: >-
      The shipped Elo half_life=100, selected on the 2023 test set, beats the
      prior default of 6.
    estimand: held_out_paired_gain
    metric: straight_up_accuracy
    estimate: -0.01923
    standard_error: 0.01594
    t: -1.21
    decision: shipped_but_contradicted
    recovered: true
    source: model/revalidate_half_life_2024_25_results.json (questions)
    note: >-
      Negative: the shipped value is WORSE than the default it replaced, on
      seasons that were genuinely clean for a margin question. Worst of 8
      candidates. Retained pending a decision rather than reverted on one
      held-out grade, but it is an open item, not a settled one.

  - id: nfl-key-number-weights
    date: "2026-09-21"
    hypothesis: >-
      Reweight the rounded-normal margin distribution by measured key-number
      multipliers, so that P(margin = 3) and P(margin = 7) reflect how
      football actually scores.
    estimand: held_out_paired_gain
    metric: log_likelihood
    estimate: 0.11399
    standard_error: 0.01628
    t: 7.00
    decision: shipped
    recovered: false
    source: data/nfl_key_numbers.json (holdout_grade)
    note: >-
      The first prospectively-logged attempt, and by far the largest effect
      this project has measured. Fitted on nflverse 2010-2021, graded once on
      2022-2025 (1,084 games). The plain rounded normal puts P(margin=3) at
      2.74% against an empirical 7.36%, so every push price on a 3 was wrong
      by nearly 3x. CAUTION: this single row moves the pooled weight from
      0.5997 to 0.9024. It is a structural fix to a known-wrong assumption
      rather than a marginal edge, which is arguably a different population
      from the other attempts. It is kept in rather than excluded -- removing
      an inconvenient row is the cherry-picking failure in reverse -- but the
      dominance is exposed by AttemptLog.is_dominated_by_one and the
      conservative robust_weight() exists because of it.

  - id: ngs-team-code-fix
    date: "2026-09-21"
    hypothesis: >-
      Normalising the nflverse NGS team code LAR to the canonical LA lets Rams
      games use the full ensemble instead of the rating-only fallback, and
      improves their predictions.
    estimand: held_out_paired_gain
    metric: mae
    estimate: 0.0911
    standard_error: 0.7570
    t: 0.12
    decision: not_shipped
    recovered: false
    source: model/ngs_team_code_fix_results.json (paired_gain)
    note: >-
      The bug is unambiguous (ADR 0004): 17 games a season since 2022 priced
      with the wrong vector because two sources spell the Rams differently.
      The FIX is not. Graded on 26 held-out games in 2022-2023 -- seasons
      neither coefficient vector was fit on -- it gains +0.0911 MAE, SE
      0.7570, t = +0.12. Indistinguishable from nothing.
      A first version of this measurement got t = -1.68 and looked like the
      fix made things WORSE. That version held elo_diff at 0.0 on both sides,
      which compares the rating-only vector against a full ensemble stripped
      of one of its own features. With the real walk-forward Elo difference
      passed to both -- the rating-only vector simply has no term for it,
      which is the shipped behaviour -- the sign flips and the effect
      vanishes. Recorded because the unfair version was the more dramatic
      result and would have been the easier one to believe.
      Consequence worth stating: this is a correctness question, not an edge
      question, and the measurement says so. Fixing it buys consistency across
      32 teams, not accuracy.

  - id: nhl-cross-season-poisson-ratings
    date: "2026-09-21"
    hypothesis: >-
      Poisson attack/defence ratings fitted on one NHL season predict the next
      season's scorelines better than league-average rates.
    estimand: held_out_paired_gain
    metric: log_likelihood
    estimate: -0.01366
    standard_error: 0.01028
    t: -1.33
    decision: not_shipped
    recovered: false
    source: model/nhl_fit_results.json (holdout_grade)
    note: >-
      Trained on 2024, graded once on 2025 -- only two seasons were usable,
      because sportsdataverse's 2021-2023 NHL files carry a CONSTANT score on
      every row and the degenerate-data guard rejects them. Directionally
      negative and not significant: team ratings from one season do not carry
      to the next well enough to beat knowing nothing.
      What the fit DID establish, and what makes it worth keeping: hockey IS
      approximately Poisson (variance/mean 0.96 and 1.04, unlike MLB's 2.2),
      but the two scores are NEGATIVELY correlated (-0.14). The
      shared-component term in BivariatePoissonDistribution can only express
      POSITIVE correlation, so it is the wrong instrument for hockey in the
      opposite direction from how it was wrong for baseball.

  - id: nba-cross-season-ratings
    date: "2026-09-21"
    hypothesis: >-
      Ridge team ratings fitted on 2021-2023 predict 2024-2025 NBA margins
      better than the league-average margin.
    estimand: held_out_paired_gain
    metric: log_likelihood
    estimate: -0.05764
    standard_error: 0.00828
    t: -6.96
    decision: rejected
    recovered: false
    source: model/nba_fit_results.json (ratings_vs_league_average)
    note: >-
      Strongly negative: stale cross-season ratings are WORSE than predicting
      the league average, by a wide margin. NBA rosters turn over enough that
      three-year-old ratings are actively misleading, which is why real models
      in this sport rate within season and walk forward.
      A second comparison on the same holdout -- sigma varying with predicted
      spread against a constant sigma -- also came back negative (t = -6.48,
      fitted slope -0.111). That does NOT refute ADR 0005's claim that NBA
      variance rises with spread: the claim is about MARKET spreads across a
      wide range, and these ratings separate games only from 0.9 to 8.6 points
      on average. Residual sd is flat across the range tested and the test
      cannot see beyond it. Recorded as inconclusive, not refuted.

# ---------------------------------------------------------------------------
# NOT ELIGIBLE: recorded so the exclusions are visible rather than invisible.
# Excluding these is a methodological choice, and a reader must be able to
# audit it without re-deriving which numbers exist.
# ---------------------------------------------------------------------------
excluded:

  - id: h1a-continuity-interaction
    t: [-0.89, -0.38]
    reason: train_side_interaction
    source: model/preseason_prior_regression_results.json
    note: "Association test, not a paired gain. Both negative, verdict REJECTED."

  - id: qb-continuity-train-interactions
    t: [2.36, 2.63, -0.35]
    reason: train_side_interaction
    source: model/qb_continuity_prior_results.json
    note: >-
      The clearest illustration of why train-side t is ineligible: +2.63 on
      train, -0.17 held out, same hypothesis.

  - id: cfb-returning-interaction
    t: [2.13, 1.43]
    reason: train_side_interaction
    source: model/cfb_carryover_check_results.json

  - id: ngs-absent-elo-coefficient
    t: [8.51, 4.14]
    reason: train_side_coefficient
    source: README ledger
    note: "t=+8.51 on train against t=1.44 held out. Include this in the weight and it alone would push b above 0.9."

  - id: totals-edge-support
    reason: different_estimand
    source: data/totals_validation.json
    note: >-
      Graded whether the model has any edge at all (hit rate vs break-even),
      not whether a change improves on an incumbent. supported=false.

  - id: spread-threshold-support
    reason: different_estimand
    source: data/spread_validation.json
    note: "Same shape as totals. supported=false, DISCLOSED NOT WITHHELD."

  - id: coach-regime-early-flags
    reason: different_estimand
    source: model/coach_regime_results.json
    note: "0/6 ATS on backed first-year external-HC teams. Single-digit cells."
