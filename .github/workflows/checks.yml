# Nothing ran these suites automatically until 2026-09-20.
#
# Every check that day happened because someone remembered to run it,
# and on one occasion nobody did: correcting a quoted figure changed a
# string that tests/test_parsers.py asserts on, the guard suite was
# re-run, the parser suite was not, and main sat red until the next
# manual check caught it. That is the exact failure this file exists
# to prevent.
#
# WHAT IT DOES NOT RUN ON. The odds and MLB jobs commit fresh snapshots
# every few hours. Running the suites on each of those would burn
# minutes on commits that cannot break anything. The per-snapshot
# directories are therefore ignored -- but data/*.json at the top level
# is NOT, because the withheld-market verdicts live there
# (totals_validation.json, margin_dist.json, spread_validation.json)
# and guard tests assert on their contents. Flipping a `supported`
# flag must run the suites.
name: checks

on:
  push:
    paths-ignore:
      - 'data/divergence/**'
      - 'data/cfb_divergence/**'
      - 'data/mlb_divergence/**'
      - 'data/ratings/**'
      - 'data/cfb_ratings/**'
      - 'data/props/**'
      - 'data/prop_grades/**'
      - 'data/site/**'
      - 'data/priors/**'
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: python suites (must match scripts/check.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      # Install the DECLARED environment, not a hand-picked subset.
      # The first version of this file installed only pandas, numpy and
      # scipy, reasoning from the imports written at the top of the two
      # test files. That missed `requests`, which arrives transitively
      # through deploy/odds_watch_job.py and deploy/weekly_job.py, and
      # four guard tests failed on the first CI run. It also assumed
      # pyreadr and pyarrow needed a toolchain; they ship wheels, and
      # the whole file installs in about eight seconds.
      #
      # Installing requirements.txt also checks that requirements.txt
      # is installable, which a hand-picked list silently never does.
      - run: pip install -r requirements.txt
      # RUN EVERY SUITE scripts/check.sh RUNS, in the same order.
      #
      # Until 2026-09-21 this job ran only the two suites below, while the
      # core suite -- 223 tests covering the five-league core, the pricing
      # and staking layers, and EVERY rot defence (migration ledger, artifact
      # manifest, conformance battery, tracked-files guard) -- ran only when
      # someone remembered `scripts/check.sh`. The defences built to stop
      # things breaking unnoticed were themselves unguarded, which is the
      # failure described at the top of this file, one level up.
      #
      # If a suite is added to scripts/check.sh, add it here too. The two
      # lists drifting apart is how this gap opened in the first place, and
      # tests/core/test_ci_covers_check_sh.py now fails when they diverge.
      - name: core suite
        run: python3 -m pytest tests/core -q
      - name: test manifest
        run: python3 tools/test_manifest.py --check
      - name: guard tests
        run: python3 tests/test_model_guards.py
      - name: parser regression tests
        run: python3 tests/test_parsers.py
      # Both suites exit non-zero on failure and print
      # "N passed, M failed, T total" before doing so, so a red run
      # names every failure rather than only the first.

  frontend:
    name: dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
