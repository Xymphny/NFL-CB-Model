# Render Blueprint for the NFL/CFB efficiency model.
#
# Usage: commit this file to the repo root, then in the Render
# dashboard: New -> Blueprint -> select this repo. Render detects
# render.yaml automatically and creates all services below in one
# pass, prompting you for the `sync: false` secrets during that
# initial creation flow.
#
# NOTE: your Render dashboard likely already has services created from
# an earlier version of this file (before the dashboard existed). Since
# this file now adds a static site block, applying it to your EXISTING
# Blueprint (via that Blueprint's own "Manual Sync", not "New ->
# Blueprint" again) should add the dashboard alongside your two working
# cron jobs. Re-running "New -> Blueprint" instead of syncing the
# existing one is what caused the duplicate-service issue earlier —
# don't repeat that here.

services:
  - type: cron
    name: weekly-ratings-job
    runtime: python
    schedule: "0 11 * * 2"  # Tuesday 11:00 UTC — Section 9.1's cadence
    buildCommand: pip install -r requirements.txt
    startCommand: python3 deploy/weekly_job.py
    envVars:
      - key: SEASON
        value: "2026"
      - key: REPO_DATA_PATH
        value: ./data
      # sync: false secrets have to live directly on the service —
      # Render silently ignores sync: false inside an envVarGroup, so
      # these are duplicated on both cron jobs below rather than
      # shared, unlike the earlier version of this file.
      - key: GIT_REPO_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: HEARTBEAT_URL
        sync: false

  - type: cron
    name: odds-watch-job
    runtime: python
    # Every 4 hours as a placeholder — Section 9.1's actual design
    # calls for schedule-aware "game days only" detection, which isn't
    # built yet (see the earlier flag about this). This fixed interval
    # runs regardless of day until that check exists.
    schedule: "0 */4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python3 deploy/odds_watch_job.py
    envVars:
      - key: REPO_DATA_PATH
        value: ./data
      - key: ODDS_API_KEY
        sync: false
      - key: GIT_REPO_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: HEARTBEAT_URL
        sync: false

  # The dashboard now exists (frontend/) — built as a Vite/React app,
# scoreboard/tote-board visual theme, reads data/ratings.json and
# data/divergence.json. The buildCommand below copies those top-level
# committed files into frontend/public/data/ before building, since
# Vite's public/ folder is what actually ends up in the served output —
# without this copy step the deployed site would have no data to show.
  - type: web
    name: football-model-dashboard
    runtime: static
    buildCommand: python3 deploy/generate_manifest.py && cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
