# Render Blueprint for the NFL/CFB efficiency model.
#
# Usage: commit this file to the repo root, then in the Render
# dashboard: New -> Blueprint -> select this repo. Render detects
# render.yaml automatically and creates all services below in one
# pass, prompting you for the `sync: false` secrets during that
# initial creation flow.
#
# NOTE: your Render dashboard likely already has services created from
# an earlier version of this file (before the dashboard existed). Since
# this file now adds a static site block, applying it to your EXISTING
# Blueprint (via that Blueprint's own "Manual Sync", not "New ->
# Blueprint" again) should add the dashboard alongside your two working
# cron jobs. Re-running "New -> Blueprint" instead of syncing the
# existing one is what caused the duplicate-service issue earlier —
# don't repeat that here.

services:
  - type: cron
    name: weekly-ratings-job
    runtime: python
    schedule: "0 11 * * 2"  # Tuesday 11:00 UTC — Section 9.1's cadence
    buildCommand: pip install -r requirements.txt
    startCommand: python3 deploy/weekly_job.py
    envVars:
      - key: SEASON
        value: "2026"
      - key: REPO_DATA_PATH
        value: ./data
      # sync: false secrets have to live directly on the service —
      # Render silently ignores sync: false inside an envVarGroup, so
      # these are duplicated on both cron jobs below rather than
      # shared, unlike the earlier version of this file.
      - key: GIT_REPO_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: HEARTBEAT_URL
        sync: false

  - type: cron
    name: odds-watch-job
    runtime: python
    # Every 4 hours as a placeholder — Section 9.1's actual design
    # calls for schedule-aware "game days only" detection, which isn't
    # built yet (see the earlier flag about this). This fixed interval
    # runs regardless of day until that check exists.
    schedule: "0 */4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python3 deploy/odds_watch_job.py
    envVars:
      - key: REPO_DATA_PATH
        value: ./data
      - key: ODDS_API_KEY
        sync: false
      - key: GIT_REPO_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: HEARTBEAT_URL
        sync: false

  # The dashboard now exists (frontend/) — built as a Vite/React app,
# scoreboard/tote-board visual theme, reads data/ratings.json and
# data/divergence.json. The buildCommand below copies those top-level
# committed files into frontend/public/data/ before building, since
# Vite's public/ folder is what actually ends up in the served output —
# without this copy step the deployed site would have no data to show.
  # Live CFB odds watch -- prices every rated NCAAF game against live
  # multi-book odds using the SAME Odds API key as the NFL job. Cron
  # schedule handles CFB's Thu-Sat calendar directly (every 6h on those
  # days), so no in-code game-day detection is needed. Credit budget:
  # ~12 calls/week at 6 credits each on top of the NFL job's usage.
  - type: cron
    name: cfb-odds-watch-job
    runtime: python
    schedule: "0 */6 * * 4,5,6"
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -c "import os; os.environ['RUN_LIVE_CFB_ODDS_WATCH']='true'; import deploy.cfb_odds_watch"
    envVars:
      - key: SEASON
        value: "2026"
      - key: REPO_DATA_PATH
        value: ./data
      - key: ODDS_API_KEY
        sync: false
      - key: GIT_REPO_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: HEARTBEAT_URL
        sync: false

  # One-off CFB historical backtest job -- TRIGGER MANUALLY from the
  # dashboard; the schedule (midnight Jan 1) exists only because cron
  # jobs require one. Runs the full CFBD lines -> sign check -> ATS
  # backtest chain and commits the caches. Needs CFBD_API_KEY set here
  # (free key: collegefootballdata.com/key); no other service needs it.
  # Set RUN_ROSTER_PRIORS=true to also grade roster features.
  - type: cron
    name: cfb-backtest-job
    runtime: python
    schedule: "0 0 1 1 *"
    buildCommand: pip install -r requirements.txt
    startCommand: python3 deploy/cfb_backtest_job.py
    envVars:
      - key: CFBD_API_KEY
        sync: false
      - key: RUN_ROSTER_PRIORS
        value: "false"
      - key: GIT_REPO_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # Coverline sync service — stores per-user settings and bet logs,
  # keyed by Discord user id (token verified against Discord's API on
  # each request, cached 10 min). The DISK IS REQUIRED: a web service's
  # filesystem is ephemeral and wiped on every deploy, which would
  # silently destroy user bet logs without it. Set ALLOWED_ORIGIN to
  # the dashboard's exact public URL once known (CORS lockdown), and
  # set VITE_SYNC_URL + VITE_DISCORD_CLIENT_ID on the static site's
  # environment so the frontend knows where to sync and how to log in.
  - type: web
    name: coverline-sync
    runtime: python
    plan: starter
    buildCommand: pip install -r sync_service/requirements.txt
    startCommand: uvicorn app:app --app-dir sync_service --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: coverline-sync-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ALLOWED_ORIGIN
        value: "*"

  - type: web
    name: football-model-dashboard
    runtime: static
    buildCommand: python3 deploy/generate_manifest.py && cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
