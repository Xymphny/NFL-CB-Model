# THE ARTIFACT MANIFEST
#
# Every file the pipeline publishes declares who produces it and who consumes
# it. An artifact with no consumer is either dead weight or a broken link, and
# both are invisible without this file.
#
# This is the defence against orphaned components. Code that nothing calls can
# be found by static analysis; a FILE that nothing reads cannot, because the
# reader would be a path string in some other module, or the frontend, or
# nothing at all. The manifest makes the consumer relationship explicit so the
# absence of one is a CI failure rather than a slow accumulation.
#
# CI checks, in tests/core/test_artifact_manifest.py:
#   1. every artifact has at least one consumer, or an explicit
#      `unconsumed_reason` explaining why not
#   2. no two artifacts claim the same path
#   3. producers and consumers name real paths in the repo where they are code
#
# NOTE ON SCOPE: this manifest covers the NEW core's artifacts. The legacy
# pipeline's published files are inventoried as their components are examined
# and given ledger rows; until then they are out of scope rather than silently
# blessed. `coverage_scope` below says so explicitly so nobody later reads an
# absence here as an assertion of health.

version: 1
coverage_scope: "src/coverline/** only; legacy model/ and deploy/ artifacts are
  inventoried per-component in migration/ledger.yaml as they are examined"

artifacts:

  - path: data/ledger/signals.jsonl
    produced_by: src/coverline/execution/ledger.py
    consumed_by:
      - src/coverline/execution/ledger.py
    kind: ledger
    refresh: "appended per recommendation, placed or not"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: model/expanded_walk_forward_cache.csv
    produced_by: model/build_expanded_walk_forward_cache.py
    consumed_by:
      - src/coverline/leagues/nfl/sources.py
    kind: silver
    refresh: "rebuilt when the rating pipeline changes; point-in-time by construction"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: data/nfl_key_numbers.json
    produced_by: model/nfl_key_numbers.py
    consumed_by:
      - src/coverline/leagues/nfl/model.py
      - tests/core/test_distributions.py
    kind: gold
    refresh: "refit only when a new holdout window is available; graded once"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: data/bronze/odds/**/historical-*.json
    produced_by: src/coverline/execution/backfill.py
    consumed_by:
      - src/coverline/execution/normalize.py
    kind: bronze
    refresh: "one-shot backfill; resumable"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: data/bronze/odds/**/current-*.json
    produced_by: src/coverline/execution/capture.py
    consumed_by:
      - src/coverline/execution/normalize.py
    kind: bronze
    refresh: "per capture window, near each slate's kickoff cluster"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: data/bronze/odds/**/*.json
    produced_by: src/coverline/execution/odds_client.py
    consumed_by:
      - src/coverline/execution/normalize.py
    kind: bronze
    refresh: "per capture; see the schedule once the runner exists"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: data/bronze/odds/_manifest.jsonl
    produced_by: src/coverline/execution/bronze.py
    consumed_by:
      - src/coverline/execution/bronze.py
    kind: bronze
    refresh: "appended on every snapshot"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: data/bronze/odds/_gaps.jsonl
    produced_by: src/coverline/execution/bronze.py
    consumed_by:
      - src/coverline/execution/bronze.py
    kind: bronze
    refresh: "appended whenever a capture does not happen"
    staleness_error_hours: null
    unconsumed_reason: >-
      Read by coverage() rather than by a pipeline stage. It exists so that
      absence is visible and countable; nothing downstream consumes it yet
      because nothing is allowed to act on a gap except a human deciding
      whether the capture process is degrading.

# Shape of a row, for when the first one lands:
#
#   - path: data/published/nfl_board.json
#     produced_by: src/coverline/apps/publish_board.py
#     consumed_by:
#       - frontend/src/App.jsx
#       - src/coverline/execution/grade.py
#     kind: gold              # bronze | silver | gold | ledger | archive
#     refresh: "weekly, Tue 11:00 UTC"
#     staleness_error_hours: 200
#     unconsumed_reason: null

  # -- Fitted league parameters -------------------------------------------
  #
  # These two shipped with no producer at all: the ratings lived as loop
  # locals inside walk_forward and were never returned, so the files could be
  # read and not regenerated. Registering them here is the smaller half of the
  # fix; model/export_fitted.py is the larger half.

  - path: data/nhl_fitted.json
    produced_by: model/export_fitted.py
    consumed_by:
      - src/coverline/leagues/nhl/model.py
    kind: gold
    refresh: "per season, after a fresh walk-forward grade on an unspent season"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: data/nba_fitted.json
    produced_by: model/export_fitted.py
    consumed_by:
      - src/coverline/leagues/nba/model.py
    kind: gold
    refresh: "per season, after a fresh walk-forward grade on an unspent season"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: model/nhl_joint_structure.json
    produced_by: model/measure_nhl_joint.py
    consumed_by:
      - tests/core/test_nhl_joint_structure.py
    kind: gold
    refresh: "when a season of NHL finals or goals is added to data/raw/nhl/"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: data/nhl_rules.json
    produced_by: model/export_fitted.py
    consumed_by:
      - src/coverline/leagues/nhl/model.py
    kind: gold
    refresh: "per season -- the pull layer is drifting, from 0.241 empty-net
      goals a game in 2017 to 0.399 in 2025"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: model/nhl_rules_results.json
    produced_by: model/fit_nhl_rules.py
    consumed_by:
      - model/export_fitted.py
    kind: gold
    refresh: "only on a re-grade, which needs an unspent season"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: model/distribution_grades.json
    produced_by: model/grade_distributions.py
    consumed_by:
      - tests/core/test_distribution_grades.py
    kind: gold
    refresh: "when a league's coefficients, dispersion constant or
      walk-forward cache changes"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: model/calibration_pit.json
    produced_by: model/calibration_pit.py
    consumed_by:
      - tests/core/test_calibration_pit.py
    kind: gold
    refresh: "with the layer it grades -- a refreshed pull table invalidates it"
    staleness_error_hours: null
    unconsumed_reason: null

  - path: model/nhl_rules_refresh_results.json
    produced_by: model/fit_nhl_rules.py
    consumed_by:
      - model/export_fitted.py
    kind: gold
    refresh: "only on a re-grade, which needs an unspent season -- the next
      one is 2026"
    staleness_error_hours: null
    unconsumed_reason: null
